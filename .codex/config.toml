personality = "pragmatic"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_verbosity = "medium"

web_search = "live"
show_raw_agent_reasoning = true

approval_policy = "never"
default_permissions = "default"

developer_instructions = "ユーザーへの応答は日本語で行う。"

[permissions."default"]
extends = ":workspace"

[permissions."default".filesystem]
# tmp directory
":tmpdir" = "write"
":slash_tmp" = "write"

# mise
"~/.local/share/mise" = "write"
"~/.local/state/mise" = "write"
"~/Library/Caches/mise" = "write"

# Go
"~/go/pkg/mod" = "write"
"~/go/pkg/sumdb" = "write"
"~/Library/Caches/go-build" = "write"
"~/Library/Application Support/go/telemetry" = "write"

# TypeScript
"~/.npm" = "write"
"~/Library/pnpm" = "write"
"~/Library/Caches/pnpm" = "write"

# Docker
"~/.docker/buildx" = "write"

# gcloud
"~/.config/gcloud" = "write"

# aws
"~/.aws" = "write"

# terraform
"~/.terraform.d " = "write"

# crit
"~/.crit" = "write"

# serena
"~/.serena" = "write"

# dotfiles
"~/projects/dotfiles" = "write"

[permissions."default".filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
".agents" = "write"
".codex" = "write"

"**/gha-creds-*.json" = "deny"
"**/.env*" = "deny"

[permissions."default".network]
enabled = true

[tui]
status_line = ["current-dir", "model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "run-state"]
theme = "one-half-dark"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[analytics]
enabled = false

[plugins."superpowers@openai-curated"]
enabled = true

[mcp_servers.serena]
command = "mise"
args = [
  "x",
  "--",
  "uvx",
  "--from",
  "git+https://github.com/oraios/serena",
  "serena",
  "start-mcp-server",
  "--enable-web-dashboard",
  "false",
  "--context",
  "codex",
]
